plugin:
  name: drama-plugin
  version: 0.1.0

providers:
  memory:
    mode: mock
  asset:
    mode: mock
  research:
    mode: mock
  production:
    mode: mock
  media:
    mode: mock
  context:
    mode: local
  speech:
    mode: disabled

services:
  memory:
    base_url: ""
    timeout_seconds: 10
    operations: {}
  asset:
    base_url: ""
    timeout_seconds: 10
    operations: {}
  research:
    base_url: ""
    timeout_seconds: 10
    operations: {}
  production:
    base_url: ""
    timeout_seconds: 30
    operations: {}
  media:
    base_url: ""
    timeout_seconds: 10
    operations: {}
  context:
    base_url: ""
    timeout_seconds: 30
    operations: {}
  speech:
    base_url: "https://api.openai.com/v1"
    api_key: null
    bailian_base_url: "https://dashscope.aliyuncs.com/api/v1"
    dashscope_api_key: null
    timeout_seconds: 30
    max_transient_retries: 2
    output_directory: ""
