[build-system]
requires = ["hatchling>=1.25", "editables>=0.5"]
build-backend = "hatchling.build"

[project]
name = "drama-plugin"
version = "0.1.0"
description = "Host-agnostic skills, tools, contracts, and context projection for historical drama agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Drama Platform Team" }]
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "mypy>=1.10,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/drama_plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]

[tool.mypy]
python_version = "3.12"
packages = ["drama_plugin"]
strict = true
incremental = false
cache_dir = "nul"
