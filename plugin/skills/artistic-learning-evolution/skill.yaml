code: artistic-learning-evolution
name: Artistic Learning and Evolution
description: Offer advisory artistic research and independent challenges after the
  complete original; retain gains, losses and the Host artistic decision.
context:
  required:
  - scope
  optional:
  - sourceRevision
  - sourceRefs
  - creativeOriginals
  - mediaRefs
  - observationRefs
  - reviewWorkspaceRef
  - hostScreenplayRef
  - hostDecisionRef
  - fullFilmScreenplayRef
  - longArcMemoryRefs
  refresh_after: []
tools:
  preferred:
  - work.get_work
  - script.get_script
  - scene.get_scene
  allowed:
  - episode.get_episode
  - shot.get_shot
  - asset.get_asset
  - media.get_media
  - context.build_context
completion:
  conditions:
  - Judgments distinguish observed evidence, interpretation, counterargument and limits.
  - Review outputs remain advisory and source-pinned; production and technical authority
    are unchanged.
