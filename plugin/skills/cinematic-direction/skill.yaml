code: cinematic-direction
name: Cinematic Execution Projection
description: Assemble approved professional direction into the existing CinematicShotSpec
  before route selection; use for source-bound projection, not new art, camera or
  acting design.
context:
  required:
  - work
  - script
  - episode
  - scene
  - shot
  optional:
  - dpdSnapshot
  - temporaryState
  - sceneDesignPacket
  - lightingScript
  - colorScript
  - costumeState
  - directorPackageRef
  - departmentInputs
  - continuityRef
  refresh_after: []
tools:
  preferred:
  - work.get_work
  - scene.get_scene
  allowed:
  - script.get_script
  - episode.get_episode
  - shot.get_shot
  - asset.get_asset
  - context.build_context
completion:
  conditions:
  - Owned output references and source pins are current; missing specialist work returns
    to its registered owner.
  - No upstream creative decisions, approvals, Media or provider-specific requests
    are authored here.
