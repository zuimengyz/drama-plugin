code: cinematic-screenplay-incubation
name: Cinematic Screenplay Incubation
description: Incubate an evidence-governed screenplay with shared creative state and targeted revision.
context:
  required: [creativeGoal]
  optional: [suppliedEvidence, work, script, episode, scenes, dramaticBible, temporaryState]
  refresh_after: []
tools:
  preferred: [research.search_sources, research.verify_claim]
  allowed: [work.get_work, script.get_script, episode.get_episode, scene.get_scene, context.build_context]
completion:
  conditions:
    - A readable screenplay and compact Dramatic Bible preserve supported historical causality, character and information continuity.
    - All twenty creative dimensions have an evidenced applicability/review result, with targeted revision bounded to two rounds.
    - Freeze identifies the reviewed revision and remaining limitations; mechanical validation does not imply user artistic acceptance or production approval.
