code: cinematic-screenplay-incubation
name: Cinematic Screenplay Incubation
description: Develop source-reconciled Historical or Literary screen drama; preserve
  upstream authority.
context:
  required:
  - creativeGoal
  optional:
  - suppliedEvidence
  - work
  - script
  - episode
  - scenes
  - dramaticBible
  - temporaryState
  - screenplayReadinessReview
  - historicalDramaticAffordances
  - screenplayInput
  - creativeSourceType
  refresh_after: []
tools:
  preferred:
  - research.search_sources
  - research.verify_claim
  allowed:
  - work.get_work
  - script.get_script
  - episode.get_episode
