completion:
  conditions:
  - 'For HISTORICAL: A readable screenplay and compact Dramatic Bible preserve supported
    historical causality, character and information continuity.'
  - All twenty creative dimensions have an evidenced applicability/review result,
    with targeted revision bounded to two rounds.
  - Freeze identifies the reviewed revision and remaining limitations; mechanical
    validation does not imply user artistic acceptance or production approval.
  - Full-film handoff records readiness dimensions and historical opportunity decisions;
    major upstream issues stop direction. For LITERARY, consume current reviewed ScreenplayInput;
    no analysis, rights or adaptation decision is rewritten by Screenplay.
