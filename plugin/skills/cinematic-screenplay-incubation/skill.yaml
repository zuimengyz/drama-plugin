code: cinematic-screenplay-incubation
name: Cinematic Screenplay Incubation
description: Complete and preserve the Host autonomous full screenplay V1, then deepen
  it through requested support and an explicit Host decision.
context:
  required:
  - creativeGoal
  optional:
  - suppliedEvidence
  - work
  - script
  - episode
  - scenes
  - dramaticBible
  - temporaryState
  - screenplayReadinessReview
  - historicalDramaticAffordances
  - screenplayInput
  - creativeSourceType
  - hostScreenplayRef
  - hostDecisionRef
  - fullFilmScreenplayRef
  - longArcMemoryRefs
  refresh_after: []
tools:
  preferred:
  - research.search_sources
  - research.verify_claim
  allowed:
  - work.get_work
  - script.get_script
  - episode.get_episode
  - scene.get_scene
  - context.build_context
  - screenplay.retain_context
  - screenplay.retain_thread
  - screenplay.begin
  - screenplay.retain_v1
  - screenplay.support_packet
  - screenplay.retain_support
  - screenplay.decide
  - screenplay.shot_handoff
completion:
  conditions:
  - 'For HISTORICAL: A readable screenplay and compact Dramatic Bible preserve supported
    historical causality, character and information continuity.'
  - Complete original V1 is preserved before advisory craft review; the Host may keep,
    develop, combine, restructure or reduce it without mandatory revisions.
  - Freeze identifies the reviewed revision and remaining limitations; mechanical
    validation does not imply user artistic acceptance or production approval.
  - Full-film handoff records readiness dimensions and historical opportunity decisions;
    major upstream issues stop direction. For LITERARY, consume current reviewed ScreenplayInput;
    no analysis, rights or adaptation decision is rewritten by Screenplay.
