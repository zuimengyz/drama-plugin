code: dialogue-design
name: Dialogue Design
description: Author or review exact spoken content, subtext and speaker/listener continuity.
context:
  required:
  - sourcePins
  - departmentInputs
  optional:
  - directorPackageRef
  - approvedBaseline
  - continuityRef
  - userFeedback
  refresh_after: []
tools:
  preferred:
  - work.get_work
  - scene.get_scene
  allowed:
  - script.get_script
  - episode.get_episode
  - shot.get_shot
  - asset.get_asset
  - context.build_context
completion:
  conditions:
  - No duplicated or lost canonical line; listener and line order resolve; quoted
    words retain their provenance; voice performance does not rewrite wording.
  - Bible records retain source/dependency pins and ownership; unresolved requirements
    remain explicit.
  - Return department output references and validation status to the Host without
    production.
