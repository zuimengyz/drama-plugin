code: director
name: Director
description: Make source-bound global creative decisions and review specialized results through an opt-in project artifact workspace.
context:
  required: [scope, sourceRevision]
  optional: [directorWorkspaceRef, cinematicIntent, dramaticBible, capabilityFeedback, approvalReferences]
  refresh_after: []
tools:
  preferred: [work.get_work, script.get_script, episode.get_episode, scene.get_scene, shot.get_shot]
