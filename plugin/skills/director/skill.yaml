code: director
name: Director
description: 'Host film authorship: complete and preserve an autonomous screenplay
  first, then choose advisory professional support and own the artistic decision.'
context:
  required:
  - scope
  - sourceRevision
  optional:
  - directorWorkspaceRef
  - cinematicIntent
  - dramaticBible
  - capabilityFeedback
  - approvalReferences
  - screenplayReadinessRef
  - directorDepartmentPacket
  - preproductionRequired
  - directorPackageRef
  - departmentInputs
  - continuityRef
  - hostScreenplayRef
  - hostDecisionRef
  - fullFilmScreenplayRef
  - longArcMemoryRefs
  refresh_after: []
tools:
  preferred:
  - work.get_work
  - script.get_script
  - episode.get_episode
  - scene.get_scene
  - shot.get_shot
  allowed:
  - context.build_context
  - asset.get_asset
  - media.get_media
  - screenplay.retain_context
  - screenplay.retain_thread
  - screenplay.begin
  - screenplay.retain_v1
  - screenplay.support_packet
  - screenplay.retain_support
  - screenplay.decide
  - screenplay.shot_handoff
completion:
  conditions:
  - Intent and capability requests reference canonical owners and current source pins
    without duplicating their semantic content.
  - Results receive explicit evidence-bound review and causal disposition before any
    adopted presentation receipt.
  - The project workspace retains a safe resume boundary; unknowns and original user
    approval gates remain independent.
  - Full-film preproduction requires current readiness, complete department originals
    and conflict review before user review; design is not production authorization.
