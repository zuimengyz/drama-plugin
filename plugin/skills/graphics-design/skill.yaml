code: graphics-design
name: Titles and Graphics
description: Design titles, name tags and source-bound historical graphics.
context:
  required:
  - sourcePins
  - departmentInputs
  optional:
  - directorPackageRef
  - approvedBaseline
  - continuityRef
  - userFeedback
  refresh_after: []
tools:
  preferred:
  - work.get_work
  - scene.get_scene
  allowed:
  - script.get_script
  - episode.get_episode
  - shot.get_shot
  - asset.get_asset
  - context.build_context
completion:
  conditions:
  - Spelling/identity and first appearance resolve; layout remains readable; no new
    historical claim or ending coda is introduced.
  - Bible records retain source/dependency pins and ownership; unresolved requirements
    remain explicit.
  - Return department output references and validation status to the Host without
    production.
