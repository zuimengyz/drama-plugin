code: historical-research
name: Historical Research
description: Build a traceable historical research context for drama creation. Use
  when an agent must investigate people, events, places, disputed claims, uncertainty,
  or the defensible boundary between evidence and dramatic invention.
context:
  required:
  - researchQuestion
  optional:
  - suppliedEvidence
  - work
  - script
  - temporaryState
  - directorPackageRef
  - departmentInputs
  - continuityRef
  refresh_after: []
tools:
  preferred:
  - research.search_sources
  - research.verify_claim
  allowed:
  - research.search_events
  - research.search_people
  - research.search_locations
completion:
  conditions:
  - Material claims have cited evidence or an explicit uncertainty label.
  - Facts, inferences, disputes, and dramatic inventions are distinguishable.
  - Consequential claims preserve source-supported actor granularity, causal role,
    sequence, and scope.
