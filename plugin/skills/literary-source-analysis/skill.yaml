code: literary-source-analysis
name: Literary Source Analysis
description: Analyse a designated literary text into anchored source facts and distinct
  interpretations; never make adaptation decisions.
context:
  required:
  - creativeSource
  optional:
  - screenplayInput
  - creativeRhythm
  refresh_after: []
tools:
  preferred:
  - source.prepare_screenplay
  allowed:
  - work.get_work
  - script.get_script
  - context.build_context
completion:
  conditions:
  - Owned contract is source-bound, distinctly labelled and reviewed; compiler validates
    the complete package without media generation.
