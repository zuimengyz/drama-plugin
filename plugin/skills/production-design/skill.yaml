code: production-design
name: Production Design Supervisor
description: Align independently authored visual departments under Director Vision;
  use for coherence review and visual conflict routing, not character, costume or
  environment authorship.
context:
  required:
  - work
  optional:
  - script
  - episode
  - scene
  - shot
  - characterAsset
  - visualBible
  - researchContext
  - userFeedback
  - temporaryState
  - screenplayReadinessRef
  - filmProductionDesign
  - sceneDesignPacket
  - costumeContinuity
  - directorPackageRef
  - departmentInputs
  - continuityRef
  refresh_after: []
tools:
  preferred:
  - work.get_work
  - scene.get_scene
  allowed:
  - script.get_script
  - episode.get_episode
  - shot.get_shot
  - asset.get_asset
  - context.build_context
completion:
  conditions:
  - Owned output references and source pins are current; missing specialist work returns
    to its registered owner.
  - No upstream creative decisions, approvals, Media or provider-specific requests
    are authored here.
