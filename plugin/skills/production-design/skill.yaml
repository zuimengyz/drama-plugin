code: production-design
name: Production Design & Casting
description: Story-led casting, faction hierarchy, set construction and reusable visual motifs before asset resolution.
context:
  required: [work]
  optional: [script, episode, scene, shot, characterAsset, visualBible, researchContext, userFeedback, temporaryState]
  refresh_after: [asset.create_asset, asset.save_asset]
tools:
  preferred: [work.get_work, asset.get_asset, asset.search_assets, media.get_media]
  allowed: [script.get_script, episode.get_episode, scene.get_scene, shot.get_shot, asset.list_assets, asset.create_asset, asset.save_asset, research.search_sources, research.verify_claim, context.build_context]
completion:
  conditions:
    - Stable design and transient state are separate, with inherited evidence constraints.
    - Core character casting has visual authority and a story-specific first appearance.
    - Design review distinguishes evidence, hypotheses and untested visual suitability.
    - Reusable text-only candidate Assets preserve existing Character and Media references.
    - Source-pinned handoff contains no provider selection, executable prompt or paid action.
