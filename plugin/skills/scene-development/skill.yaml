code: scene-development
name: Scene Development
description: Develop a persistent, state-changing Scene from an Episode.
context:
  required: [episode]
  optional: [sceneId, neighboringScenes, researchContext, temporaryState]
  refresh_after: [scene.create_scene, scene.save_scene]
tools:
  preferred: [episode.get_episode, scene.get_scene, scene.list_scenes, scene.search_scenes, scene.create_scene, scene.save_scene]
  allowed: [research.search_locations, research.verify_claim, context.build_context, context.refresh_context]
completion:
  conditions:
    - Place, time, participants, entry state, objective, conflict, turn, and exit state are explicit.
    - Dialogue and action advance the Episode without silently creating downstream Shots.
    - Persistence follows sufficient context, an internal plan, a complete draft, and a passing Scene review with no unresolved historical or continuity conflict.
