code: scene-development
name: Scene Development
description: Develop a complete Host-authored scene director screenplay from the full-film
  framework before professional realization; preserve originals and adopted authority.
context:
  required:
  - episode
  optional:
  - sceneId
  - neighboringScenes
  - researchContext
  - temporaryState
  - directorPackageRef
  - departmentInputs
  - continuityRef
  - hostScreenplayRef
  - hostDecisionRef
  - fullFilmScreenplayRef
  - longArcMemoryRefs
  refresh_after:
  - scene.create_scene
  - scene.save_scene
tools:
  preferred:
  - episode.get_episode
  - scene.get_scene
  - scene.list_scenes
  - scene.search_scenes
  - scene.create_scene
  - scene.save_scene
  allowed:
  - research.search_locations
  - research.verify_claim
  - context.build_context
  - context.refresh_context
  - screenplay.retain_context
  - screenplay.retain_thread
  - screenplay.begin
  - screenplay.retain_v1
  - screenplay.support_packet
  - screenplay.retain_support
  - screenplay.decide
  - screenplay.shot_handoff
completion:
  conditions:
  - The complete original scene V1 is preserved before professional support; the Host
    selects the later full version, including KEEP_ALL.
  - Formal Scene persistence retains existing attribution and continuity authority;
    candidate prose cannot silently overwrite adopted facts.
  - The selected full scene, its Host decision and relevant long-arc sources reach
    Shot design.
