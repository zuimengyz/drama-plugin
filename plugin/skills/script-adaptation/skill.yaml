code: script-adaptation
name: Script Adaptation
description: Adapt a Work into a persistent audiovisual Script.
context:
  required: [work]
  optional: [scriptId, researchContext, temporaryState]
  refresh_after: [script.create_script, script.save_script]
tools:
  preferred: [work.get_work, script.get_script, script.create_script, script.save_script]
  allowed: [script.list_scripts, research.verify_claim, context.build_context, context.refresh_context]
completion:
  conditions:
    - Main line, secondary lines, arcs, pacing, climax, and short-form structure support the Work.
    - The Script remains screenable and continuity-aware without creating downstream Episodes.
