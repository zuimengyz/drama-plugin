code: shot-design
name: Shot Design
description: Realize the complete Host-selected scene screenplay through meaningful
  shots and performance; preserve formal department and adoption authority.
context:
  required:
  - scene
  optional:
  - shotId
  - neighboringShots
  - selectedAssetIds
  - researchContext
  - temporaryState
  - sceneDesignPacket
  - lightingScript
  - screenplayReadinessRef
  - directorPackageRef
  - departmentInputs
  - continuityRef
  - hostScreenplayRef
  - hostDecisionRef
  - fullFilmScreenplayRef
  - longArcMemoryRefs
  refresh_after:
  - shot.create_shot
  - shot.save_shot
tools:
  preferred:
  - scene.get_scene
  - shot.get_shot
  - shot.list_shots
  - shot.search_shots
  - shot.create_shot
  - shot.save_shot
  allowed:
  - asset.get_asset
  - media.get_media
  - context.build_context
  - context.refresh_context
  - screenplay.shot_handoff
completion:
  conditions:
  - Coverage and thin Shot refs preserve approved Scene meaning, bindings and start/end
    states.
  - Camera, Blocking, Action and Editorial originals remain separately owned.
  - Persistence requires sufficient context, an internal plan, a complete draft and
    a passing review with source/department refs preserved; no copied specialist designs
    or automatic production.
