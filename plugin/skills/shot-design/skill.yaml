code: shot-design
name: Shot Design
description: Design actual shots, coverage purpose and start/end states from approved
  camera, blocking and action originals; use for coverage and thin Shot assembly,
  not camera or editorial re-authorship.
context:
  required:
  - scene
  optional:
  - shotId
  - neighboringShots
  - selectedAssetIds
  - researchContext
  - temporaryState
  - sceneDesignPacket
  - lightingScript
  - screenplayReadinessRef
  - directorPackageRef
  - departmentInputs
  - continuityRef
  refresh_after:
  - shot.create_shot
  - shot.save_shot
tools:
  preferred:
  - scene.get_scene
  - shot.get_shot
  - shot.list_shots
  - shot.search_shots
  - shot.create_shot
  - shot.save_shot
  allowed:
  - asset.get_asset
  - media.get_media
  - context.build_context
  - context.refresh_context
completion:
  conditions:
  - Coverage and thin Shot refs preserve approved Scene meaning, bindings and start/end
    states.
  - Camera, Blocking, Action and Editorial originals remain separately owned.
  - Persistence requires sufficient context, an internal plan, a complete draft and
    a passing review with source/department refs preserved; no copied specialist designs
    or automatic production.
