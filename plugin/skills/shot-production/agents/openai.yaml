interface:
  display_name: "Shot Production"
  short_description: "Produce Shot media through provider-neutral tools"
  default_prompt: "Use $shot-production to produce only the requested media for this approved Shot."

dependencies:
  tools:
    - type: "mcp"
      value: "comfy-cloud"
      description: "Optional Host-provided visual production capability used only for image or video execution"
      transport: "streamable_http"
      url: "https://cloud.comfy.org/mcp"
