code: shot-production
name: Shot Production
description: Produce physical Media for a Shot through implementation-neutral generation tools.
context:
  required: [shot, scene]
  optional: [selectedAssetIds, generatedMediaIds, previousMediaIds, temporaryState]
  refresh_after: [production.generate_image, production.generate_video, production.generate_audio]
tools:
  preferred: [shot.get_shot, scene.get_scene, asset.get_asset, media.get_media, production.generate_image, production.generate_video, production.generate_audio]
  allowed: [media.list_media, context.build_context, context.refresh_context]
completion:
  conditions:
    - Requested image, video, or audio outputs are returned as stable mediaIds with clear Shot semantics.
    - No storage, workflow, filename, node, or other implementation detail leaks into Skill output.
