code: shot-production
name: Shot Production
description: Produce physical Media for a Shot through implementation-neutral generation tools.
context:
  required: [shot, scene]
  optional: [selectedAssetIds, generatedMediaIds, previousMediaIds, temporaryState]
  refresh_after: [media.import_media, production.generate_audio]
tools:
  preferred: [shot.get_shot, scene.get_scene, asset.get_asset, asset.search_assets, media.get_media, media.resolve_media, media.import_media, production.generate_audio]
  allowed: [asset.list_assets, media.list_media, context.build_context, context.refresh_context]
completion:
  conditions:
    - Requested image, video, or audio outputs pass the applicable per-Shot review and exist as stable mediaIds with clear Shot semantics.
    - Visual requests use a recorded plan of no more than three stable Asset-plus-Media references and stop on a missing key visible character reference or required runtime capability.
    - Continuous Review-PASS Shots preserve Locked Facts, allow justified deltas, and pass the applicable cross-Shot continuity review.
    - No storage, provider, workflow, filename, node, or other implementation detail leaks into Drama domain facts.
