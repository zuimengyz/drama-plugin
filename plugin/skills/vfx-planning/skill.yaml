code: vfx-planning
name: VFX and Compositing Planning
description: Plan visual extensions and composites without changing recorded historical
  events.
context:
  required:
  - sourcePins
  - departmentInputs
  optional:
  - directorPackageRef
  - approvedBaseline
  - continuityRef
  - userFeedback
  refresh_after: []
tools:
  preferred:
  - work.get_work
  - scene.get_scene
  allowed:
  - script.get_script
  - episode.get_episode
  - shot.get_shot
  - asset.get_asset
  - context.build_context
completion:
  conditions:
  - No new historical participant or event is invented; extensions match light, perspective
    and continuity; effects do not obscure causal action.
  - Bible records retain source/dependency pins and ownership; unresolved requirements
    remain explicit.
  - Return department output references and validation status to the Host without
    production.
