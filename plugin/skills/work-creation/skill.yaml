code: work-creation
name: Work Creation
description: Shape research context into a persistent literary Work.
context:
  required: [researchContext, creativeIntent]
  optional: [workId, temporaryState]
  refresh_after: [work.create_work, work.save_work]
tools:
  preferred: [work.get_work, work.search_works, work.create_work, work.save_work]
  allowed: [work.list_works, research.verify_claim, context.build_context, context.refresh_context]
completion:
  conditions:
    - A character-driven formal story foundation establishes premise, protagonist goal and need, capable opposition, stakes, theme, arcs, causal architecture, climax, and ending rather than an event summary.
    - Historical constraints, uncertainty, and dramatic invention remain explicit.
    - Persistence follows sufficient context, an internal plan, a complete draft, and a passing Work review with no unresolved historical or continuity conflict.
