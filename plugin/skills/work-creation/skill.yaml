code: work-creation
name: Work Creation
description: Shape research context into a persistent literary Work.
context:
  required: [researchContext, creativeIntent]
  optional: [workId, temporaryState]
  refresh_after: [work.create_work, work.save_work]
tools:
  preferred: [work.get_work, work.search_works, work.create_work, work.save_work]
  allowed: [work.list_works, research.verify_claim, context.build_context, context.refresh_context]
completion:
  conditions:
    - Historical scope, an ordered causal spine, actor hierarchy, and scope-relative Narrative Authority govern protagonist selection; fact attribution stays at evidence-supported actor granularity and causality is not reassigned downward.
    - Story architecture maps to the historical spine, compatible dramatization remains deletable from historical causality, and structure estimates derive from coverage rather than quotas.
    - Persistence follows sufficient context, an internal plan, a complete draft, and a passing binary Work review with every historical hard gate satisfied.
