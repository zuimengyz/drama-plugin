cases:
  - id: superior-to-subordinate
    expectedFingerprint: 25a6510f58f378486f4f6e82c7a7dbdf037c5976d00f326599c3776c296c5b4c
    scene:
      sceneId: scene-consequence-a
      sourceFingerprint: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      dramaticPurpose: force a public commitment under military pressure
      conflictCondition: a military crisis makes refusal immediately consequential
      powerStructure: the questioner holds formal command over the listener
      emotionalClimate: contained alarm
      urgencyContext: action is required before the next dispatch
      informationAsymmetry: the listener underestimates the operational loss
      socialConstraints: [formal command hearing]
      direction:
        publicPrivateContext: public formal proceeding
        performanceBoundaries: [do not collapse authority into shouting]
    beat:
      beatId: beat-compliance
      actor: speaker:questioner
      obstacle: the listener avoids accepting responsibility
      transitionTrigger: the listener must answer before the assembly
      direction:
        interactionTarget: speaker:listener
        objective: frighten the listener into obedience
        tactic: controlled intimidation
        authorityPosition: dominant formal superior
        relationshipStance: coercive
        internalActivation: HIGH
        externalControl: HIGH
    line:
      dramaticAction: warn
      observableIntent: make the consequence unmistakable without losing composure
      continuity: tightens the prior demand
      changeFromPrevious: converts implication into an explicit warning
  - id: peer-to-peer
    expectedFingerprint: ffa45d47713a661859d4990780351c777e383d4e7c46f12bb26c2e012a4c3743
    scene:
      sceneId: scene-consequence-b
