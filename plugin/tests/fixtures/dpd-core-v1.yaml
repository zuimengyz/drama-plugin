        interactionTarget: speaker:listener
        objective: test whether the listener understands the danger
        tactic: guarded probe
        authorityPosition: equal
        relationshipStance: guarded and distrustful
        internalActivation: MEDIUM
        externalControl: HIGH
    line:
      dramaticAction: probe
      observableIntent: invite recognition while concealing how much is already known
