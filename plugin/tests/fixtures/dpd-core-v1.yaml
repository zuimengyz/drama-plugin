      dramaticPurpose: determine whether an ally recognizes the danger
      conflictCondition: neither peer can safely disclose full certainty
      powerStructure: both speakers hold comparable situational authority
      emotionalClimate: alert restraint
      urgencyContext: a decision is near but not yet irreversible
      informationAsymmetry: each suspects the other knows more
      socialConstraints: [private strategic consultation]
      direction:
