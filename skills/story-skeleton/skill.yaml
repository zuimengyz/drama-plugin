code: story-skeleton
name: Story Skeleton
description: Define a causal historical-drama story spine without imposing a fixed workflow.
context:
  required: [project, story, constraints]
  optional: [historicalEvidence, entities, episode]
  refresh_after: [history.verify_claim]
tools:
  preferred: [context.build_context, project.get_story]
  allowed: [project.list_episodes, history.search_historical_event, history.verify_claim, context.refresh_context]
completion:
  conditions:
    - Premise, objective, opposition, escalation, climax, and ending form a causal spine.
    - Historical constraints and dramatic inventions are explicit.
