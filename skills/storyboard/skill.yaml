code: storyboard
name: Storyboard
description: Express scene intent as concise, continuity-aware shot coverage.
context:
  required: [scene, entities, assets]
  optional: [shot, historicalEvidence, constraints]
  refresh_after: [asset.resolve_asset_hierarchy]
tools:
  preferred: [context.build_context, project.list_shots, asset.resolve_asset_hierarchy]
  allowed: [project.get_shot, media.list_asset_media, context.refresh_context]
completion:
  conditions:
    - Shot sequence covers the scene turn without redundant shots.
    - Every shot identifies framing, action, duration, and semantic references.
