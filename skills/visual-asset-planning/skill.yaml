code: visual-asset-planning
name: Visual Asset Planning
description: Plan reusable assets and variants through the asset contract.
context:
  required: [entities, assets]
  optional: [scene, shot, historicalEvidence, constraints]
  refresh_after: [asset.resolve_asset_hierarchy, generation.get_generation_result]
tools:
  preferred: [context.build_context, asset.search_assets, asset.resolve_asset_hierarchy]
  allowed: [asset.get_asset, media.list_asset_media, generation.create_generation_plan, context.refresh_context]
completion:
  conditions:
    - Every required entity has an effective asset or a documented generation need.
    - Proposed variants have a clear base, scene, or shot scope.
